<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#55D195"/>
      <stop offset="0.5" stop-color="#249170"/>
      <stop offset="1" stop-color="#13586B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.22" cy="0.12" r="0.85">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="depth" cx="0.8" cy="0.95" r="0.7">
      <stop offset="0" stop-color="#0A3A44" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#0A3A44" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D9F7EA"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#06323A" flood-opacity="0.4"/>
    </filter>
    <clipPath id="tile">
      <rect width="1024" height="1024" rx="232"/>
    </clipPath>
  </defs>

  <rect width="1024" height="1024" rx="232" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="232" fill="url(#depth)"/>
  <rect width="1024" height="1024" rx="232" fill="url(#glow)"/>

  <!-- a tilted pane of frosted glass behind the letter -->
  <rect x="268" y="268" width="488" height="488" rx="112" transform="rotate(-11 512 512)"
        fill="url(#sheet)" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="5"/>

  <!-- the T, solid glass catching the light -->
  <g filter="url(#lift)">
    <rect x="276" y="300" width="472" height="128" rx="64" fill="url(#glass)"/>
    <rect x="448" y="300" width="128" height="456" rx="64" fill="url(#glass)"/>
  </g>
  <rect x="300" y="312" width="424" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.7"/>

  <!-- glossy top edge and a fine rim -->
  <g clip-path="url(#tile)">
    <ellipse cx="420" cy="-40" rx="760" ry="400" fill="url(#sheen)" opacity="0.55"/>
  </g>
  <rect x="3" y="3" width="1018" height="1018" rx="229" fill="none" stroke="#FFFFFF" stroke-opacity="0.38" stroke-width="6"/>
</svg>
